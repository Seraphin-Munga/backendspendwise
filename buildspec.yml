version: 0.2

phases:
  install:
    commands:
      - echo "Installing .NET 9 SDK..."
      - |
        # Download and install .NET 9 SDK
        curl -fsSL https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh || wget -q https://dot.net/v1/dotnet-install.sh -O dotnet-install.sh
        chmod +x dotnet-install.sh
        ./dotnet-install.sh --version 9.0.308 --install-dir /usr/local/share/dotnet
      - |
        # Create symlink to make dotnet available in PATH
        ln -sf /usr/local/share/dotnet/dotnet /usr/local/bin/dotnet || true
        export PATH=/usr/local/share/dotnet:/usr/local/bin:$PATH
      - echo "Verifying .NET installation..."
      - /usr/local/share/dotnet/dotnet --version
      - /usr/local/share/dotnet/dotnet --list-sdks

  pre_build:
    commands:
      - echo "Restoring NuGet packages..."
      - /usr/local/share/dotnet/dotnet restore SpendWiseApi.sln

  build:
    commands:
      - echo "Building solution..."
      - /usr/local/share/dotnet/dotnet build SpendWiseApi.sln -c Release --no-restore
      - echo "Publishing application..."
      - /usr/local/share/dotnet/dotnet publish SpendWiseAPI/SpendWiseApi.csproj -c Release -o publish --no-restore

  post_build:
    commands:
      - echo "Build completed successfully"
      - echo "Publishing output:"
      - ls -la publish/

artifacts:
  files:
    - '**/*'
  base-directory: publish
